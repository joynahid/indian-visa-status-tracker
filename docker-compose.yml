services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indianvisa}
      POSTGRES_USER: ${POSTGRES_USER:-indianvisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indianvisa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indianvisa} -d ${POSTGRES_DB:-indianvisa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - indian-visa

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
      - COMMA_SEPARATED_PROXY_URLS=${COMMA_SEPARATED_PROXY_URLS}
      - TWO_CAPTCHA_KEY=${TWO_CAPTCHA_KEY}
      - STATUS_CHECK_SECRET=${STATUS_CHECK_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-indianvisa}:${POSTGRES_PASSWORD:-indianvisa}@postgres:5432/${POSTGRES_DB:-indianvisa}
    volumes:
      - ./apps/backend:/app/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - indian-visa

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BASE_API_URL=http://localhost:8765
      - CI=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/frontend:/app/
      - /app/node_modules/
      - /app/.next/
    depends_on:
      backend:
        condition: service_started
    networks:
      - indian-visa

networks:
  indian-visa:
    driver: bridge

volumes:
  pgdata:
